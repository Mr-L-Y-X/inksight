# ============================================================
# InkSight 前端站点 Nginx 追加片段（在「前端 3000」的配置里追加）
# ============================================================
#
# 使用方式：
#   前端已经挂在某个 Nginx 站点上（宝塔 Node 项目 / 前端 3000），
#   你只需要在它已有的 server {} 块里，追加下面这一段「/api 反代」，
#   其余配置（前端静态资源、域名、证书等）保持不动。
#
# 效果：
#   浏览器 → Nginx（前端站点，端口不变）
#             ├─ /      → 前端（本来就是它管的，不动）
#             └─ /api/  → 后端（新增这一段）
#
# 端口被占用时：
#   宝塔把后端 Python 项目换个端口（如 8080 → 9090），
#   只改下面 proxy_pass 里的那一处，前端零改动、不重新 build。
# ============================================================

    # ============ 追加从这里开始 ============

    # 后端 API 反代（加到前端站点的 server {} 内，location / 之前或之后均可）
    location /api/ {
        # 后端真实监听端口（宝塔 Python 项目创建时填的），改这里即可
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式渲染（语音、LLM 流式输出）需要关缓冲，否则会卡到结束才吐
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传图片放宽大小限制（若前端站点 server 块已设了更大的 client_max_body_size 可省略）
    client_max_body_size 32m;

    # ============ 追加到这里结束 ============
